name: iOS Build

# 云端只负责编译出**未签名** IPA；签名与安装交给设备端
# （SideStore / LiveContainer / SideInstaller 用你自己的 Apple ID 本地签名），
# 因此本仓库不需要任何证书或描述文件 Secret，也不会碰你的 Apple ID。
#
# 手动触发：Actions → iOS Build → Run workflow
# 自动触发：由 .github/workflows/ios-sync.yml 在检测到上游新稳定版后调用

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: '要构建的 ref（留空 = 触发本次运行的 ref）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '构建成功后发布 GitHub Release（未签名 IPA 作为 release 资产）'
        required: true
        type: boolean
        default: false
      release_notes:
        description: 'Release 说明（留空自动生成）'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      checkout_ref:
        description: '要构建的 ref（留空 = 调用方的 ref）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '构建成功后发布 GitHub Release'
        required: false
        type: boolean
        default: true
      release_notes:
        description: 'Release 说明'
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: '构建出的版本号（取自 package.json）'
        value: ${{ jobs.build.outputs.version }}
      tag:
        description: 'Release tag（ios-v<version>）'
        value: ${{ jobs.build.outputs.tag }}
      ipa_name:
        description: 'IPA 文件名'
        value: ${{ jobs.build.outputs.ipa_name }}

permissions:
  contents: write

concurrency:
  # 同一 ref 的构建串行，避免两个版本并发写 release 时产物串台。
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      ipa_name: ${{ steps.package.outputs.ipa_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "=== 可用 Xcode ==="
          ls -d /Applications/Xcode*.app || true
          # Capacitor 8 要求 Xcode 26+；macos-26 镜像默认已满足，这里选最新一个。
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcode-select -p
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ios-v$version" >> "$GITHUB_OUTPUT"
          echo "上游版本：$version"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Sync web assets and iOS platform
        # 这一步会重新生成 iOS 图标/启动画面、构建 Web 产物，
        # 并按 package.json 的 Capacitor 插件集合重写 CapApp-SPM/Package.swift。
        run: npm run ios:sync

      - name: Verify generated SPM manifest
        run: |
          set -euo pipefail
          echo "=== CapApp-SPM/Package.swift ==="
          cat ios/App/CapApp-SPM/Package.swift
          # Package.swift 必须只引用真实存在的插件；旧基线里的
          # @capacitor/status-bar 已在上游被 SystemBars 取代，若仍出现说明
          # cap sync 没有重写它，构建会失败在更靠后的位置。
          if grep -q 'CapacitorStatusBar' ios/App/CapApp-SPM/Package.swift; then
            echo "::error::Package.swift 仍引用 @capacitor/status-bar（已从依赖中移除），cap sync ios 未正确重写"
            exit 1
          fi

      - name: Run iOS project checks
        run: |
          set -euo pipefail
          # test:ios-project 依赖 macOS 自带的 plutil / sips，只能在 runner 上跑。
          # 它同时校验 Bundle Identifier、MARKETING_VERSION 与 package.json 一致、
          # Package.swift 无 Windows 反斜杠路径、图标尺寸与无 alpha 等。
          npm run lint
          npm run test:ios-platform
          npm run test:ios-native-plugin
          npm run test:ios-project
          npm run test:native-platform
          npm run test:device-media-controls
          npm run test:apple-translation
          npm run test:free-translation
          npm run test:translation
          npm run test:ui-font

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee xcodebuild.log | tail -60

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          cd ios/App
          app="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$app" ]; then
            echo "::error::未找到 $app，构建产物路径与预期不符"
            exit 1
          fi
          ipa="NewsNook-${{ steps.meta.outputs.version }}-unsigned.ipa"
          # 未签名校验（必须在打包前做，Payload 稍后会被清理）
          if codesign -dv "$app" 2>&1 | grep -q 'Signature='; then
            echo "::warning::产物带有签名信息，预期为未签名包"
          else
            echo "已确认：产物未签名"
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$app" Payload/
          # 保证是干净的未签名包：移除可能残留的签名与描述文件。
          rm -rf Payload/App.app/_CodeSignature
          rm -f Payload/App.app/embedded.mobileprovision
          zip -qry "$ipa" Payload
          rm -rf Payload
          echo "ipa_name=$ipa" >> "$GITHUB_OUTPUT"
          echo "=== IPA ==="
          ls -lh "$ipa"
          echo "=== 包内结构（前 20 项）==="
          unzip -l "$ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewsNook-${{ steps.meta.outputs.version }}-unsigned-ipa
          path: ios/App/${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          IPA: ios/App/${{ steps.package.outputs.ipa_name }}
          NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          notes="$NOTES_INPUT"
          if [ -z "$notes" ]; then
            upstream_version="${TAG#ios-v}"
            printf -v notes 'NewsNook iOS 未签名 IPA，对应上游 Android 稳定版 %s。\n\n安装方式：下载后用 SideStore / LiveContainer / SideInstaller 以你自己的 Apple ID 本地签名。\n本产物未签名，不含任何证书或描述文件。\n' "$upstream_version"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传资产"
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" --title "$TAG" --notes "$notes"
          fi
          echo "已发布：$TAG"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## NewsNook iOS 构建"
            echo ""
            echo "- 版本：\`${{ steps.meta.outputs.version }}\`"
            echo "- 产物：\`${{ steps.package.outputs.ipa_name }}\`"
            echo "- 签名：未签名（设备端本地签名）"
            echo "- Release：\`${{ steps.meta.outputs.tag }}\`（publish_release=${{ inputs.publish_release }}）"
          } >> "$GITHUB_STEP_SUMMARY"
