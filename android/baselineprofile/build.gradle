apply plugin: 'com.android.test'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'androidx.baselineprofile'

android {
    namespace 'com.aizeek.newsnook.profiletests'
    compileSdk rootProject.ext.compileSdkVersion
    targetProjectPath ':app'

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Generate shared startup paths on the cloud flavor; the app plugin
        // merges these rules into main so local also receives the core profile.
        missingDimensionStrategy 'translation', 'cloud'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        animationsDisabled true
    }
}

baselineProfile {
    useConnectedDevices true
}

dependencies {
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.5.0'
    implementation "androidx.test.ext:junit:$androidxJunitVersion"
    implementation 'androidx.test:runner:1.7.0'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
